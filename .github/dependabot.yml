# Dependabot configuration.
#
# Maintains versioned dependencies across the repo. Security updates are
# handled separately by Dependabot Security Updates (enabled at repo level).
# This file covers regular version bumps.
#
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Python deps — uv (pyproject.toml + uv.lock at the repo root)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      # Group minor + patch bumps per area to reduce noise. Major bumps still
      # come as individual PRs (default).
      python-runtime:
        patterns:
          - "click"
          - "pydantic"
          - "pyyaml"
        update-types:
          - "minor"
          - "patch"
      python-dev:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
          - "bandit"
          - "pip-audit"
          - "pre-commit"
          - "types-*"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # GitHub Actions — workflow pins (bumped weekly; pin by SHA, see workspace rule)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # Docker base image — Dockerfile.dev (matched: the docker ecosystem fetches
  # any filename containing "dockerfile", case-insensitive)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
