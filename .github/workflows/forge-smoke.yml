name: forge-smoke

# L3 smoke (spec §9.3, §15): build real RPM/DEB/OCI, then (a) install the package
# on the target distro and (b) consume a real SIGNED repo from a container, and
# (c) build+inspect a multi-arch OCI image. Needs docker + nfpm + repo tools +
# qemu, so it runs on the runner (NOT in the dev image / make ci). Gated tests
# skip without the env.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/forge/**"
      - "tests/integration/**"
      - ".github/workflows/forge-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Install nfpm (matches the dev image pin)
        run: |
          version=2.46.3
          curl -fsSL \
            "https://github.com/goreleaser/nfpm/releases/download/v${version}/nfpm_${version}_Linux_x86_64.tar.gz" \
            -o /tmp/nfpm.tgz
          sudo tar -xzf /tmp/nfpm.tgz -C /usr/local/bin nfpm
          nfpm --version
      - name: Install repo tooling (createrepo_c, apt-ftparchive, gpg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq createrepo-c apt-utils gnupg
      - name: Set up qemu/binfmt (cross-arch OCI build)
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64
      - name: Sync dependencies
        run: uv sync
      - name: L3 install + distribution smoke
        env:
          FORGE_NETWORK_TESTS: "1"
          FORGE_DOCKER_TESTS: "1"
        run: uv run pytest tests/integration -v
