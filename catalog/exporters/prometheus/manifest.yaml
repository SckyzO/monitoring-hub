kind: exporter
name: prometheus
description: The Prometheus monitoring system and time series database.
category: Infrastructure
version: v3.12.0
spec:
  upstream:
    type: github
    repo: prometheus/prometheus
    strategy: latest_release
  build:
    method: binary_repack
    binary_name: prometheus
    extra_binaries:
    - promtool
  artifacts:
    rpm:
      enabled: true
      targets:
      - el8
      - el9
      - el10
      summary: The Prometheus monitoring system and time series database.
      systemd:
        enabled: true
        arguments:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/var/lib/prometheus
        - --web.listen-address=0.0.0.0:9090
      system_user: prometheus
      extra_files:
      - source: assets/prometheus.yml
        dest: /etc/prometheus/prometheus.yml
        config: true
      directories:
      - path: /etc/prometheus
        mode: '0755'
        owner: root
        group: root
      - path: /var/lib/prometheus
        mode: '0755'
        owner: prometheus
        group: prometheus
    deb:
      enabled: true
      targets:
      - debian-12
      summary: The Prometheus monitoring system and time series database.
      systemd:
        enabled: true
      section: net
      priority: optional
      system_user: prometheus
      extra_files:
      - source: assets/prometheus.yml
        dest: /etc/prometheus/prometheus.yml
        config: true
      directories:
      - path: /etc/prometheus
        mode: '0755'
        owner: root
        group: root
      - path: /var/lib/prometheus
        mode: '0755'
        owner: prometheus
        group: prometheus
    docker:
      enabled: true
      entrypoint:
      - /usr/bin/prometheus
      cmd:
      - --config.file=/etc/prometheus/prometheus.yml
      validation:
        port: 9090
        enabled: true
