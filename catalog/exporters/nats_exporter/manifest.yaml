kind: exporter
name: nats_exporter
description: NATS metrics exporter for Prometheus.
category: Messaging
version: v0.20.1
spec:
  upstream:
    type: github
    repo: nats-io/prometheus-nats-exporter
    strategy: latest_release
    archive_name: prometheus-nats-exporter-v{clean_version}-linux-{upstream_linux_arch}.tar.gz
  build:
    method: binary_repack
    binary_name: prometheus-nats-exporter
    archs:
    - amd64
    - arm64
    extra_binaries: []
    extra_sources: []
  artifacts:
    rpm:
      enabled: true
      targets:
      - el8
      - el9
      - el10
      summary: NATS metrics exporter for Prometheus.
      systemd:
        enabled: true
    deb:
      enabled: true
      targets:
      - debian-12
      summary: NATS metrics exporter for Prometheus.
      systemd:
        enabled: true
      section: net
      priority: optional
    docker:
      enabled: true
      dockerfile: templates/Dockerfile.j2
      entrypoint:
      - /usr/bin/nats_exporter
      validation:
        enabled: true
        port: 7777
        args: -varz http://localhost:8222
