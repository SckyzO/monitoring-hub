kind: exporter
name: json_exporter
description: A prometheus exporter which scrapes remote JSON by JSONPath.
category: Messaging
version: v0.7.0
spec:
  upstream:
    type: github
    repo: prometheus-community/json_exporter
  build:
    method: binary_repack
    binary_name: json_exporter
    archs:
    - amd64
    - arm64
    extra_binaries: []
    extra_sources: []
  artifacts:
    rpm:
      enabled: true
      targets:
      - el8
      - el9
      - el10
      summary: A prometheus exporter which scrapes remote JSON by JSONPath.
      systemd:
        enabled: true
        arguments:
        - --config.file=/etc/json_exporter/config.yml
      extra_files:
      - source: assets/config.yml
        dest: /etc/json_exporter/config.yml
        mode: '0644'
      directories:
      - path: /etc/json_exporter
        mode: '0755'
    deb:
      enabled: true
      targets:
      - debian-12
      summary: A prometheus exporter which scrapes remote JSON by JSONPath.
      systemd:
        enabled: true
        arguments:
        - --config.file=/etc/json_exporter/config.yml
      section: net
      priority: optional
      extra_files:
      - source: assets/config.yml
        dest: /etc/json_exporter/config.yml
        mode: '0644'
      directories:
      - path: /etc/json_exporter
        mode: '0755'
    docker:
      enabled: true
      dockerfile: templates/Dockerfile.j2
      entrypoint:
      - /usr/bin/json_exporter
      validation:
        enabled: true
        port: 7979
      cmd: []
